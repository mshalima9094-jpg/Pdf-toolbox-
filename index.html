<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF টুলবক্স</title>
<meta name="theme-color" content="#0e7a58"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PDF Toolbox"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f6f8f7;--card:#fff;--tx:#16201b;--mut:#66736c;--ac:#13a36b;--ac2:#e3f5ed;--bd:#e2e8e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--tx:#eaf1ed;--mut:#93a39a;--ac:#2fcf93;--ac2:#1f3a2e;--bd:#2a3731}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Noto Sans Bengali","Kalpurush",sans-serif}
main{max-width:640px;margin:auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:13px;letter-spacing:.04em;color:var(--ac);margin:18px 0 8px}
input[type=search],input[type=text],select{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 4px 9px;text-align:center;color:var(--tx);font:inherit;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .12s,box-shadow .12s;min-width:0}.c:active{transform:scale(.95)}.c:hover{box-shadow:0 4px 12px rgba(0,0,0,.12)}
.c i{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:hsl(var(--h,150) 75% 92%);font-style:normal;font-size:17px;margin:0 auto 6px}
.c b{display:block;font-size:12.5px;line-height:1.25}.c small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--mut);font-size:10px;line-height:1.3;margin-top:2px;padding:0 2px}
button.p{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:600 16px inherit;margin-top:12px;cursor:pointer}
button.p:disabled{opacity:.5}
.b{background:none;border:0;color:var(--ac);font:600 15px inherit;padding:6px 0;cursor:pointer}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:14px}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:22px;text-align:center;background:var(--card);cursor:pointer}
.fl{font-size:14px;color:var(--mut);margin-top:8px;word-break:break-all}
#st{margin-top:12px;font-size:14px;color:var(--mut)}
.im{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px}
.im img{height:70px;border-radius:6px}.im button{margin-left:auto}
.hide{display:none}.gr{display:flex;gap:8px;align-items:center;margin-top:10px}.gr input{flex:1}.gb{border:0;border-radius:10px;padding:9px 12px;background:var(--ac);color:#fff;font:600 14px inherit;cursor:pointer;white-space:nowrap}
.hero{display:block;width:100%;height:auto;margin:6px 0 14px;border-radius:22px;filter:drop-shadow(0 12px 18px rgba(6,56,42,.35))}
#home>h1{background:linear-gradient(135deg,#13a36b,#0e7fa8);color:#fff;padding:18px 16px;border-radius:18px;margin:6px 0 14px;font-size:22px;box-shadow:0 6px 18px rgba(19,163,107,.28)}#home>h1 small{display:block;color:#ffffffcc!important;font-size:12.5px!important;font-weight:400;margin-top:2px}
body{background:radial-gradient(900px 420px at 50% -80px,hsl(165 65% 82%),transparent 65%),var(--bg);background-attachment:fixed;min-height:100vh}
#q{border-radius:999px;padding:13px 18px;border:1px solid rgba(255,255,255,.8);box-shadow:0 6px 18px -8px rgba(10,60,45,.35),inset 0 1px 0 #fff}
#home>h1{position:relative;overflow:hidden;background:linear-gradient(135deg,#06382a 0%,#0e7a58 55%,#16a79b 100%);border:1px solid rgba(255,255,255,.25);box-shadow:0 14px 30px -12px rgba(6,56,42,.7),inset 0 1px 0 rgba(255,255,255,.35)}
#home>h1:before{content:'';position:absolute;right:-40px;top:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%)}
#home>h1:after{content:'';position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));pointer-events:none}
.c{background:linear-gradient(180deg,#fff 0%,hsl(160 30% 96%) 100%);border:1px solid rgba(255,255,255,.95);border-radius:18px;box-shadow:0 10px 18px -10px rgba(8,60,44,.45),0 2px 4px rgba(8,60,44,.08),inset 0 1px 0 #fff}
.c:hover{transform:translateY(-2px);box-shadow:0 16px 24px -10px rgba(8,60,44,.5),0 2px 4px rgba(8,60,44,.1),inset 0 1px 0 #fff}
.c i{position:relative;overflow:hidden;width:38px;height:38px;border-radius:12px;font-size:18px;background:linear-gradient(150deg,hsl(var(--h,150) 88% 64%),hsl(calc(var(--h,150) + 28) 80% 40%));box-shadow:0 8px 14px -5px hsl(var(--h,150) 80% 35%/.75),inset 0 1px 1px rgba(255,255,255,.8),inset 0 -4px 8px rgba(0,0,0,.2);text-shadow:0 2px 3px rgba(0,0,0,.35)}
.c i:after{content:'';position:absolute;left:2px;right:2px;top:1px;height:46%;border-radius:11px 11px 60% 60%/11px 11px 35% 35%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05));pointer-events:none}
.c b{font-weight:650;letter-spacing:.01em}
h2{font-weight:700;margin:22px 2px 10px}
button.p{background:linear-gradient(180deg,#2ad08f 0%,#0e9a66 100%);border-radius:14px;box-shadow:0 10px 20px -8px rgba(14,154,102,.8),inset 0 1px 0 rgba(255,255,255,.55);text-shadow:0 1px 1px rgba(0,0,0,.2)}
.drop{border-radius:18px;box-shadow:inset 0 1px 0 #fff,0 8px 18px -12px rgba(8,60,44,.5)}.im{box-shadow:0 8px 16px -10px rgba(8,60,44,.4)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:radial-gradient(900px 420px at 50% -80px,hsl(165 60% 18%),transparent 65%),var(--bg)}:root:not([data-theme="light"]) .c{background:linear-gradient(180deg,#25322c,#1a2420);border-color:rgba(255,255,255,.08);box-shadow:0 10px 18px -10px #000,inset 0 1px 0 rgba(255,255,255,.1)}:root:not([data-theme="light"]) .c i{background:linear-gradient(150deg,hsl(var(--h,150) 80% 58%),hsl(calc(var(--h,150) + 28) 75% 34%))}:root:not([data-theme="light"]) #q{border-color:rgba(255,255,255,.1);box-shadow:0 6px 18px -8px #000}}h2{display:flex;align-items:center;gap:8px}h2:after{content:'';flex:1;height:1px;background:var(--bd)}
#tool>h1{font-size:19px}.drop{border-color:var(--ac);background:var(--ac2);color:var(--tx)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .c i{background:hsl(var(--h,150) 35% 24%)}}
</style></head><body><main>

<script>
const {PDFDocument,rgb,degrees,StandardFonts}=PDFLib;
const $=s=>document.querySelector(s);
const R={k:'r',l:'পেজ (যেমন 1-3,5; ফাঁকা = সব)',ph:'সব পেজ',d:''};
const bytes=async f=>new Uint8Array(await f.arrayBuffer());
const st=t=>$('#st').textContent=t;
const rng=(s,n)=>{s=(s||'').trim();if(!s)return[...Array(n).keys()];const o=[];s.split(',').forEach(x=>{const[a,b]=x.split('-').map(v=>parseInt(v));if(!a)return;for(let i=a;i<=(b||a);i++)if(i>=1&&i<=n)o.push(i-1)});return o};
async function save(name,data){
  try{const d=window.claude?await claude.use('downloads'):null;if(d){await d.save({filename:name,data});return}}catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;a.click();
}
const load=async f=>PDFDocument.load(await bytes(f),{ignoreEncryption:true});
const pjs=async f=>pdfjsLib.getDocument({data:await bytes(f)}).promise;
